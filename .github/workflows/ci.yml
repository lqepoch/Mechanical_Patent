name: Mechanical Patent CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    name: 测试-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite:
          - test_core.py
          - test_cli.py
          - test_papers.py
          - test_paper_sources.py
          - test_workflow.py
          - test_web_crawler.py
          - test_local_workspace.py
          - test_pdf_archive.py
          - test_quality_lineage.py
          - test_workspace_cli.py
          - test_benchmarks.py
          - test_pdf_extraction.py
          - test_mcp_bridge.py
          - test_skill_mirrors.py
          - test_citations.py
          - test_fission_mcp.py
          - test_literature_memory.py
          - test_project_latex_frontier.py
          - test_container_deployment.py
          - test_technical_brief.py
          - test_conversion_gate.py
          - test_technical_review.py
          - test_figure_pipeline.py
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Codex 简体中文 Skills 镜像核验
        run: python scripts/sync_skill_mirrors.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -p '${{ matrix.suite }}' -v

  mcp-contract:
    name: MCP-v2协议发现与工具调用
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK v2
        run: python -m pip install -e '.[mcp]'
      - name: Protocol discovery and invocation
        run: python -m unittest discover -s tests -p 'test_fission_mcp.py' -v

  latex-pedantic-export:
    name: LaTeX Pandoc 真实格式导出
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python -m pip install -e .
      - name: Run real Pandoc export and project isolation regression
        run: python -m unittest discover -s tests -p 'test_project_latex_frontier.py' -v

name: Mechanical Patent CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    name: 测试-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite:
          - test_core.py
          - test_cli.py
          - test_papers.py
          - test_workflow.py
          - test_web_crawler.py
          - test_local_workspace.py
          - test_pdf_archive.py
          - test_quality_lineage.py
          - test_workspace_cli.py
          - test_benchmarks.py
          - test_pdf_extraction.py
          - test_mcp_bridge.py
          - test_skill_mirrors.py
          - test_citations.py
          - test_fission_mcp.py
          - test_knowledge_atlas.py
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Codex 简体中文 Skills 镜像核验
        run: python scripts/sync_skill_mirrors.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -p '${{ matrix.suite }}' -v

  mcp-contract:
    name: MCP-v2协议发现与工具调用
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK v2
        run: python -m pip install -e '.[mcp]'
      - name: Protocol discovery and invocation
        run: python -m unittest discover -s tests -p 'test_fission_mcp.py' -v


  atlas-web-build:
    name: 知识星图前端离线打包
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装固定的顶级前端依赖
        working-directory: atlas-web
        run: npm install --no-audit --fund=false
      - name: 静态打包检查
        working-directory: atlas-web
        run: npm run build

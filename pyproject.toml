[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-patent"
version = "0.1.0"
description = "Evidence-first autonomous mechanical patent research and drafting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3.0"]
web = ["crawl4ai==0.9.5"]
pdf = ["docling==2.150.0"]
patent-mcp = ["patent-client-agents[mcp]==0.32.0"]

[project.scripts]
mechanical-patent = "mechanical_patent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
